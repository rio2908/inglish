name: Build Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake autopoint gettext \
            libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Android build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-android.txt

      - name: Validate Python source
        run: python -m py_compile main.py game_logic.py sprites.py speech.py words.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build debug APK
        run: |
          # Ignore SIGPIPE from yes; the pipeline still returns Buildozer's status.
          set +o pipefail
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnifferGarden-Android-debug
          path: bin/*.apk
          if-no-files-found: error
