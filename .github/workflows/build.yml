name: Deploy Web Game to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt

      - name: Validate Python source
        run: |
          python -m py_compile main.py game_logic.py sprites.py speech.py words.py
          python -m pyflakes main.py game_logic.py sprites.py speech.py words.py
          python -m unittest discover -s tests -v

      - name: Build Web Game with Pygbag
        run: python -m pygbag --build --ume_block 0 .

      - name: Patch Pygbag 0.9.3 BrowserFS URL
        run: |
          python - << 'EOF'
          import os, re

          html_path = 'build/web/index.html'
          if os.path.exists(html_path):
              with open(html_path, 'r', encoding='utf-8') as f:
                  html = f.read()

              # 1. Исправляем 404: заменяем битую ссылку на надежный CDN jsDelivr
              html = re.sub(
                  r'<script\s+src=["\'][^"\']*browserfs\.min\.js["\']\s*></script>',
                  '<script src="https://cdn.jsdelivr.net/npm/browserfs@1.4.3/dist/browserfs.min.js"></script>',
                  html
              )
              html = html.replace('https://pygame-web.github.io/cdn/0.9.3//browserfs.min.js', 'https://cdn.jsdelivr.net/npm/browserfs@1.4.3/dist/browserfs.min.js')
              html = html.replace('//cdn/0.9.3//browserfs.min.js', 'https://cdn.jsdelivr.net/npm/browserfs@1.4.3/dist/browserfs.min.js')

              # Сохраняем игровое соотношение сторон 5:3 на телефонах и
              # исключаем прокрутку/масштабирование страницы во время касаний.
              html = html.replace(
                  '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
                  '    <meta name="viewport" content="height=device-height, initial-scale=1.0">',
                  '<meta name="viewport" content="width=device-width, height=device-height, '
                  'initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">'
              )

              mobile_css = '''
              <style id="sniffer-mobile-layout">
                  html, body {
                      width: 100%;
                      height: 100%;
                      margin: 0;
                      overflow: hidden;
                      overscroll-behavior: none;
                      background: #000;
                  }

                  canvas.emscripten {
                      touch-action: none;
                      user-select: none;
                      -webkit-user-select: none;
                      margin: auto;
                  }

                  @media (max-aspect-ratio: 5/3) {
                      canvas.emscripten {
                          width: 100vw;
                          height: 60vw;
                      }
                  }

                  @media (min-aspect-ratio: 5/3) {
                      canvas.emscripten {
                          width: 166.6667vh;
                          height: 100vh;
                          width: 166.6667dvh;
                          height: 100dvh;
                      }
                  }
              </style>
              '''
              html = html.replace('</head>', mobile_css + '\n</head>')

              with open(html_path, 'w', encoding='utf-8') as f:
                  f.write(html)
              print("Файл index.html успешно пропатчен!")
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
